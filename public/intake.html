<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GCC Counseling Intake — Preview</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f3f5f1; --surface:#fff; --fg:#20302c; --muted:#5d6a65; --line:#dfe5df;
    --accent:#0f6b5c; --accent-ink:#0b4d42; --accent-soft:#e2efeb; --focus:#0f6b5c;
    --danger:#a6362e; --sand:#8a5d00; --sand-bg:#f8efd8;
    --shadow:0 1px 2px rgba(20,40,35,.05),0 6px 24px rgba(20,40,35,.07);
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#131816;--surface:#1b2220;--fg:#e7ece9;--muted:#9aa8a2;--line:#2a322e;
    --accent:#58cdb8;--accent-ink:#8fe0d1;--accent-soft:#163029;--focus:#58cdb8;
    --danger:#f0938a;--sand:#e0b767;--sand-bg:#33280f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3);color-scheme:dark;}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.55;
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  .sandbanner{background:var(--sand-bg);color:var(--sand);font-size:.8rem;font-weight:600;text-align:center;padding:6px 14px}
  .progress{height:5px;background:var(--line);flex:0 0 auto}
  .progress > i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
  main{flex:1;display:flex;justify-content:center;padding:26px 18px 150px}
  .card{width:100%;max-width:640px;margin-block:auto}
  .tag{font-family:Spectral,serif;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;margin:0 0 10px}
  h1,h2{font-family:Spectral,Georgia,serif;text-wrap:balance;margin:0}
  h1{font-size:1.85rem;font-weight:600}
  h2.sec{font-size:1.5rem;font-weight:600;margin:0 0 14px}
  .lede{color:var(--muted);font-size:1.03rem;margin:10px 0 0}
  .body{font-size:1.06rem;line-height:1.7}
  .body p{margin:0 0 14px}
  label.f{display:block;font-weight:600;margin:0 0 4px}
  input[type=text],input[type=tel],input[type=email]{width:100%;font:inherit;font-size:1.05rem;color:var(--fg);
    background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin:6px 0 20px}
  input:focus,canvas:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  .req{color:var(--accent)}
  .agreebox{background:var(--sand-bg);border-left:4px solid var(--sand);border-radius:8px;padding:14px 16px;margin:18px 0 6px}
  .agreebox label{display:flex;gap:11px;align-items:flex-start;cursor:pointer}
  .agreebox input{width:20px;height:20px;margin-top:2px;flex:0 0 auto}
  .sigwrap{margin-top:8px}
  canvas.sig{width:100%;height:180px;background:#fff;border:1.5px solid var(--accent);border-radius:12px;touch-action:none;display:block}
  .sigrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .clear{background:none;border:none;color:var(--muted);font:inherit;font-size:.9rem;cursor:pointer;text-decoration:underline}
  .sighint{color:var(--muted);font-size:.85rem}
  .err{color:var(--danger);font-size:.9rem;margin-top:10px;min-height:1.1em}
  .nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
  .nav-inner{width:100%;max-width:640px;display:flex;align-items:center;gap:10px}
  .btn{font:inherit;font-weight:600;font-size:1rem;border-radius:12px;padding:12px 22px;cursor:pointer;border:1.5px solid transparent;white-space:nowrap}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-ink)}
  .btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
  .btn.ghost:hover{color:var(--fg)}
  .btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
  .spacer{flex:1}
  .count{color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums;text-align:center}
  .done{text-align:center;padding-top:20px}
  .check{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px;font-size:2rem}
</style>
</head>
<body>
  <div class="sandbanner">PREVIEW for review · nothing is sent or saved anywhere but this browser · <a href="/intake/flow" style="color:inherit">how it decides</a></div>
  <div class="progress"><i id="bar"></i></div>
  <main><div class="card" id="card"></div></main>
  <div class="nav"><div class="nav-inner" id="nav"></div></div>

<script>
/* ---- the lawyer's wording — VERBATIM, do not edit ---- */
const SECTIONS = [
  ['Our Framework', `The discipleship counseling provided is based on scriptural principles rather than secular psychology or psychiatry. Neither the pastoral nor the lay counselors of this church are trained or licensed as psychotherapists or mental health professionals, nor should they be expected to follow the methods of such specialists. Counseling will be provided by one of the pastors or trained disciplers supervised by a pastor. We strongly encourage same gender counseling. Some of the counseling at GCC is provided as part of a discipleship counseling training program. To facilitate both counseling and training, the discipler may have one to two people assisting him/her in each counseling session.`],
  ['Biblical Basis', `We believe that the Bible provides sufficient guidance and instruction for faith and life. Therefore, our counseling is based on scriptural principles rather than those of psychology or psychiatry. Neither the pastoral nor the lay counselors of this ministry are licensed as psychotherapists or mental health professionals. All of our counselors are under the authority of the elders of Grace Community Church.`],
  ['Not Professional Advice', `If you have significant legal, financial, medical or other technical questions, you should seek advice from another independent professional. Our pastoral and lay counselors will be happy to cooperate with such advisors and help you to consider their counsel in the light of relevant scriptural principles.`],
  ['Confidentiality', `Biblical confidentiality is conditional, and it is also an important aspect of the counseling process; we will carefully guard the information you entrust to us. However, because we are continually training others to be effective counselors, we ask that you agree to allow counselors in training to be present during your sessions. There are four other situations when it may be necessary for us to share certain information with others: (1) When a counselor is uncertain of how to address a particular problem and needs to seek advice from another pastor or elder in this church; (2) when a counselee attends another church and it is necessary to talk with his or her pastor or elders; (3) when there is a clear indication that someone may be harmed unless we otherwise intervene; or (4) when a person persistently refuses to renounce a particular sin and it becomes necessary to seek the assistance of others in the church to encourage repentance and reconciliation (see Proverbs 15:22; 24:11; Matthew 18:15-20). Please be assured that our counselors strongly prefer not to disclose personal information to others, and they will make every effort to help you find ways to resolve problems as privately as possible.`],
  ['Childcare', `Unfortunately, at this time we cannot provide childcare while you attend your counseling session. If you have children who are not involved in the counseling session itself, please do not bring them with you to your session.`],
  ['Counseling Minors', `We believe the primary responsibility for shepherding and discipling children and teenagers rests with their parents. Accordingly, when counseling children and teenagers, the counselor may share information from the counseling sessions with either or both of the custodial parents if the counselor believes it is wise to do so. (When requesting counseling for a teenager, Consent to Counsel forms must be signed by both the teenager and a custodial parent.)`],
  ['Liability', `It is intended that the Bible shall be the authority governing the counseling process, and that God's Glory is the ultimate goal. However, failure of the Counselor to interpret or apply the Bible in any particular way shall not subject the Counselor to liability or give rise to complaint by anyone. There shall be no legal or other liability that attaches the Counselor or any related institution or person for any advice, method, conduct or any act or omission related in any way to the service that is provided, and Counselee acknowledges that Counselee is voluntarily seeking this counsel (free from coercion, duress, or pressure) with a full understanding of the nature, purpose, and effect of this agreement.`],
  ['Termination', `At any time and for any reason, Counselor or Counselee may terminate counseling. However, termination will not preclude the Counselor from making the disclosures set forth above if deemed appropriate by the Counselor, or if compelled by other legal means. The Counselor is not required to keep records, but if records are made, the Counselor may destroy any such records without incurring liability.`],
  ['Resolution of Conflicts', `On rare occasions a conflict may arise between counselor and counselee. In order to make sure that any such conflicts will be resolved in a biblically faithful manner, we require all of our counselees to agree that any dispute that arises with the counselor or with this church as a result of counseling will be settled through mediation within the church according to the principles of Scripture and the authority of this local church.`],
  ['Our Fee', `All counseling is done free of charge as a ministry of GCC. Part of the weekly homework assignments may require the purchase of materials that correspond to the counseling.`],
];

/* pages: 0 = start, 1..10 = sections, 11 = sign, 12 = done */
const SIGN = SECTIONS.length + 1;
const DONE = SECTIONS.length + 2;
let page = 0;
const data = { name:'Jane Doe (example)', phone:'', email:'', signedAt:null, signature:null };

const card = document.getElementById('card');
const nav  = document.getElementById('nav');
const bar  = document.getElementById('bar');
const esc  = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){
  bar.style.width = (page/(DONE))*100 + '%';
  card.innerHTML=''; nav.innerHTML='';

  if(page===0){                                   // ---- startup ----
    card.innerHTML = `<p class="tag">Grace Community Church · Counseling</p>
      <h1>Consent to Counsel</h1>
      <p class="lede">Before we begin, please confirm your details and read the consent. It's 10 short
      pages — please actually read them — and you'll sign at the end.</p>
      <div style="margin-top:22px">
        <label class="f">Name <span class="req">*</span></label>
        <input id="name" type="text" value="${esc(data.name)}">
        <label class="f">Phone <span class="req">*</span></label>
        <input id="phone" type="tel" value="${esc(data.phone)}" placeholder="(555) 123-4567">
        <label class="f">Email <span class="req">*</span></label>
        <input id="email" type="email" value="${esc(data.email)}" placeholder="you@email.com">
        <p class="lede" style="font-size:.9rem">Your counselor pre-filled these — fix anything that's off. (Password step: parked — TBD.)</p>
      </div>`;
    card.querySelector('#name').oninput = e=>data.name=e.target.value;
    card.querySelector('#phone').oninput= e=>data.phone=e.target.value;
    card.querySelector('#email').oninput= e=>data.email=e.target.value;
    nav.innerHTML = `<span class="count">Getting started</span><span class="spacer"></span>
      <button class="btn primary" id="begin">Begin</button>`;
    nav.querySelector('#begin').onclick = ()=>go(1);
    return;
  }

  if(page>=1 && page<=SECTIONS.length){           // ---- a consent chunk ----
    const [title, text] = SECTIONS[page-1];
    card.innerHTML = `<p class="tag">Consent · ${page} of ${SECTIONS.length}</p>
      <h2 class="sec">${esc(title)}</h2>
      <div class="body"><p>${esc(text)}</p></div>`;
    nav.innerHTML =
      `<button class="btn ghost" id="back">Back</button>
       <button class="btn danger" id="cancel">Cancel</button>
       <span class="spacer"></span>
       <span class="count">${page} / ${SECTIONS.length}</span><span class="spacer"></span>
       <button class="btn primary" id="agree">Agree</button>`;
    nav.querySelector('#back').onclick   = ()=>go(page-1);
    nav.querySelector('#cancel').onclick = cancelToLogin;
    nav.querySelector('#agree').onclick  = ()=>go(page+1);
    return;
  }

  if(page===SIGN){                                 // ---- sign ----
    card.innerHTML = `<p class="tag">Final step</p>
      <h2 class="sec">Sign the consent</h2>
      <p class="lede">By signing, ${esc(firstName())} agrees to <strong>all ten sections above</strong>
      and is seeking this counsel voluntarily.</p>
      <div class="agreebox"><label>
        <input type="checkbox" id="agreeck">
        <span><strong>I have read and agree to the Consent to Counsel above.</strong></span>
      </label></div>
      <p class="f" style="margin-top:18px">Sign with your finger or mouse:</p>
      <div class="sigwrap">
        <canvas class="sig" id="sig" tabindex="0"></canvas>
        <div class="sigrow"><span class="sighint">${esc(firstName())} · ${new Date().toLocaleDateString()}</span>
          <button class="clear" id="clear">Clear</button></div>
      </div>
      <p class="err" id="err"></p>`;
    setupSignature();
    nav.innerHTML =
      `<button class="btn ghost" id="back">Back</button>
       <button class="btn danger" id="cancel">Cancel</button>
       <span class="spacer"></span>
       <button class="btn primary" id="submit">Sign &amp; continue</button>`;
    nav.querySelector('#back').onclick   = ()=>go(SECTIONS.length);
    nav.querySelector('#cancel').onclick = cancelToLogin;
    nav.querySelector('#submit').onclick = submitSignature;
    return;
  }

  if(page===DONE){                                 // ---- done ----
    card.innerHTML = `<div class="done">
      <div class="check">✓</div>
      <h2 class="sec">Consent signed.</h2>
      <p class="lede">Thank you, ${esc(firstName())}. Your signed consent is recorded. Next, a few
      questions so your counselor can help well.</p>
      <p class="lede" style="font-size:.85rem;margin-top:14px">(Real flow: the signed PDF + .json are
      built and held — nothing emails until the PDI is done too. Then both send to your counselor.)</p>
    </div>`;
    nav.innerHTML = `<span class="spacer"></span>
      <button class="btn primary" id="toPdi">Continue to the questions →</button>
      <span class="spacer"></span>`;
    nav.querySelector('#toPdi').onclick = ()=>{
      // Start the PDI FRESH (don't resume a prior test's saved progress).
      try{ localStorage.removeItem('gcc-intake-sandbox'); localStorage.removeItem('gcc-intake-sandbox-i'); }catch(e){}
      location.href='/intake/pdi';
    };
    return;
  }
}

function firstName(){ return (data.name||'friend').trim().split(/\s+/)[0]; }

function go(p){ page = Math.max(0, Math.min(DONE, p)); render(); window.scrollTo(0,0); }

function cancelToLogin(){
  // "Cancel goes back to login." In the sandbox that's the start screen.
  if(confirm('Cancel and return to login? Your consent is not signed.')){ page=0; render(); window.scrollTo(0,0); }
}

/* ---- finger-signature pad (same technique as the DGR react-signature-canvas) ---- */
let sigDirty=false;
function setupSignature(){
  const c=document.getElementById('sig'); const ctx=c.getContext('2d'); sigDirty=false;
  function fit(){
    const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,r.width,r.height);
    ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111';
  }
  fit();
  let drawing=false, last=null;
  const pt=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  c.addEventListener('pointerdown',e=>{drawing=true;last=pt(e);c.setPointerCapture(e.pointerId);});
  c.addEventListener('pointermove',e=>{ if(!drawing)return; const p=pt(e);
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;sigDirty=true; });
  c.addEventListener('pointerup',()=>drawing=false);
  c.addEventListener('pointercancel',()=>drawing=false);
  document.getElementById('clear').onclick=()=>{fit();sigDirty=false;};
  c._getData=()=>c.toDataURL('image/png');
}

function submitSignature(){
  const err=document.getElementById('err');
  if(!document.getElementById('agreeck').checked){ err.textContent='Please check the agreement box first.'; return; }
  if(!sigDirty){ err.textContent='Please sign in the box before continuing.'; return; }
  data.signature = document.getElementById('sig')._getData();
  data.signedAt = new Date().toISOString();
  // Real flow: POST name/phone/email + sections agreed + signature → server builds the signed PDF + .json,
  // HOLDS it (does not email), then routes to the PDI. Here we just advance.
  go(DONE);
}

render();
</script>
</body>
</html>
